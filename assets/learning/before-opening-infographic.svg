<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc"><title id="title">خمس خطوات قبل الافتتاح</title><desc id="desc">السوق، الخطة، الميزانية، التمويل، والهوية. ملخص تعليمي من عبدالماجد العيلي.</desc><rect width="1080" height="1600" fill="#28374a"/><path d="M70 0V1600M1010 0V1600" stroke="#ffd3a4" opacity=".15"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="start" direction="rtl"><text x="950" y="110" fill="#ffd3a4" font-size="23">مكتبة عبدالماجد العيلي · قبل الافتتاح</text><text x="950" y="195" fill="#fff" font-size="65" font-weight="bold">قبل أن تصرف ريالًا…</text><text x="950" y="270" fill="#ffd3a4" font-size="53">راجع هذه الخطوات الخمس</text><rect x="100" y="330" width="880" height="180" rx="5" fill="#f5f3ee"/><circle cx="915" cy="380" r="25" fill="#ffd3a4"/><text x="915" y="389" text-anchor="middle" direction="ltr" fill="#28374a" font-size="24">01</text><text x="865" y="387" fill="#94603a" font-size="25">السوق</text><text x="930" y="440" fill="#28374a" font-size="34" font-weight="bold">افهم السوق. واسمع عميلك.</text><text x="930" y="481" fill="#65717b" font-size="25">من عميلي؟ وما الحاجة التي أخدمها؟</text><rect x="100" y="540" width="880" height="180" rx="5" fill="#f5f3ee"/><circle cx="915" cy="590" r="25" fill="#ffd3a4"/><text x="915" y="599" text-anchor="middle" direction="ltr" fill="#28374a" font-size="24">02</text><text x="865" y="597" fill="#94603a" font-size="25">الخطة</text><text x="930" y="650" fill="#28374a" font-size="34" font-weight="bold">اكتب خطتك. واجعلها قابلة للتعديل.</text><text x="930" y="691" fill="#65717b" font-size="25">ماذا أبيع؟ لمن؟ وكيف؟</text><rect x="100" y="750" width="880" height="180" rx="5" fill="#f5f3ee"/><circle cx="915" cy="800" r="25" fill="#ffd3a4"/><text x="915" y="809" text-anchor="middle" direction="ltr" fill="#28374a" font-size="24">03</text><text x="865" y="807" fill="#94603a" font-size="25">الميزانية</text><text x="930" y="860" fill="#28374a" font-size="34" font-weight="bold">احسب البداية. وما بعدها.</text><text x="930" y="901" fill="#65717b" font-size="25">التأسيس + تشغيل الأشهر الأولى</text><rect x="100" y="960" width="880" height="180" rx="5" fill="#f5f3ee"/><circle cx="915" cy="1010" r="25" fill="#ffd3a4"/><text x="915" y="1019" text-anchor="middle" direction="ltr" fill="#28374a" font-size="24">04</text><text x="865" y="1017" fill="#94603a" font-size="25">التمويل</text><text x="930" y="1070" fill="#28374a" font-size="34" font-weight="bold">حدد مصدر المال. وتوقيت الحاجة.</text><text x="930" y="1111" fill="#65717b" font-size="25">من أين تأتي السيولة؟ ومتى أحتاجها؟</text><rect x="100" y="1170" width="880" height="180" rx="5" fill="#f5f3ee"/><circle cx="915" cy="1220" r="25" fill="#ffd3a4"/><text x="915" y="1229" text-anchor="middle" direction="ltr" fill="#28374a" font-size="24">05</text><text x="865" y="1227" fill="#94603a" font-size="25">الهوية</text><text x="930" y="1280" fill="#28374a" font-size="34" font-weight="bold">ابنِ هوية. ووعدًا واضحًا.</text><text x="930" y="1321" fill="#65717b" font-size="25">الاسم والشعار والتجربة: رسالة متسقة</text><text x="950" y="1450" fill="#ffd3a4" font-size="30">قبل أن تفتح… راجع الأساس.</text><text x="950" y="1505" fill="#fff" font-size="25">عبدالماجد العيلي · تطوير أعمال وتنفيذ مشاريع تجارية</text><text x="950" y="1550" fill="#c6cdd5" font-size="18">ملخص تعليمي للمقطع الأول · مادة للتوعية والتخطيط الأولي</text></g></svg>