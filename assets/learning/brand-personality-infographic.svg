<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc"><title id="title">كيف تبني شخصية علامتك التجارية؟</title><desc id="desc">أربع خطوات تربط صفات العلامة بصوتها ومظهرها، وتساعدك على الحفاظ على شخصية متسقة في الخدمة والردود والمحتوى وكل نقطة تواصل.</desc><rect width="1080" height="1600" fill="#28374a"/><g direction="rtl" text-anchor="start" font-family="Tahoma,Arial,sans-serif"><text x="980" y="85" fill="#ffd3a4" font-size="25">مكتبة عبدالماجد العيلي · الهوية البصرية</text><text x="980" y="165" fill="white" font-size="58" font-weight="bold">شخصية علامتك</text><text x="980" y="240" fill="#ffd3a4" font-size="54" font-weight="bold">تظهر في كل تفصيلة.</text><rect x="90" y="305" width="900" height="220" rx="12" fill="#f5f3ee"/><text x="950" y="353" font-size="25" fill="#81502c">01 / الصفات</text><text x="950" y="417" font-size="38" font-weight="bold" fill="#28374a">اختر ثلاث صفات تصف علامتك.</text><text x="950" y="475" font-size="28" fill="#535e6b">دافئة، دقيقة، جريئة… وما لا تكونه العلامة.</text><rect x="90" y="555" width="900" height="220" rx="12" fill="#f5f3ee"/><text x="950" y="603" font-size="25" fill="#81502c">02 / الصوت</text><text x="950" y="667" font-size="38" font-weight="bold" fill="#28374a">حدد كيف تتكلم علامتك.</text><text x="950" y="725" font-size="28" fill="#535e6b">كلمات تستخدمها وأخرى تتجنبها، ونبرة ثابتة.</text><rect x="90" y="805" width="900" height="220" rx="12" fill="#f5f3ee"/><text x="950" y="853" font-size="25" fill="#81502c">03 / المظهر</text><text x="950" y="917" font-size="38" font-weight="bold" fill="#28374a">اجعل الشخصية مرئية.</text><text x="950" y="975" font-size="28" fill="#535e6b">الألوان والشعار والمكان والتغليف بلغة واحدة.</text><rect x="90" y="1055" width="900" height="220" rx="12" fill="#f5f3ee"/><text x="950" y="1103" font-size="25" fill="#81502c">04 / الاتساق</text><text x="950" y="1167" font-size="38" font-weight="bold" fill="#28374a">التزم بها في كل نقطة تواصل.</text><text x="950" y="1225" font-size="28" fill="#535e6b">الخدمة والرد والمحتوى والفريق بنبرة واحدة.</text><text x="980" y="1400" fill="#ffd3a4" font-size="32">علامة تعرف من هي، يعرفها عميلك.</text><text x="980" y="1460" fill="white" font-size="30">حدد شخصيتها، ثم التزم بها في كل تفاصيلها.</text><text x="980" y="1540" fill="#ffd3a4" font-size="24">عبدالماجد العيلي · من الفكرة إلى الأثر</text></g></svg>