<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc"><title id="title">ذائقتك أم ذائقة الجمهور؟ وقناعتك أم السوق؟</title><desc id="desc">خمس أفكار توازن بين ذائقتك واحتياج العميل: الاستماع لسلوكه، وتحديد القيم الثابتة، والمرونة في التفاصيل، وتجربة نسخة صغيرة قبل القرار.</desc><rect width="1080" height="1600" fill="#28374a"/><g direction="rtl" text-anchor="start" font-family="Tahoma,Arial,sans-serif"><text x="980" y="85" fill="#ffd3a4" font-size="25">مكتبة عبدالماجد العيلي · فهم السوق</text><text x="980" y="165" fill="white" font-size="54" font-weight="bold">ذائقتك أم ذائقة الجمهور؟</text><text x="980" y="238" fill="#ffd3a4" font-size="52" font-weight="bold">وقناعتك أم السوق؟</text><rect x="90" y="290" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="332" font-size="24" fill="#81502c">01 / ذائقتك</text><text x="950" y="388" font-size="35" font-weight="bold" fill="#28374a">ذائقتك بداية، لا رأي الجميع.</text><text x="950" y="438" font-size="27" fill="#535e6b">حبك للمنتج لا يعني أن غيرك سيحبه.</text><rect x="90" y="500" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="542" font-size="24" fill="#81502c">02 / الجمهور</text><text x="950" y="598" font-size="35" font-weight="bold" fill="#28374a">اسمع العميل وراقب سلوكه.</text><text x="950" y="648" font-size="27" fill="#535e6b">راقب ما يفعله العميل، لا ما يقوله فقط.</text><rect x="90" y="710" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="752" font-size="24" fill="#81502c">03 / الثوابت</text><text x="950" y="808" font-size="35" font-weight="bold" fill="#28374a">حدد ما لا تتنازل عنه.</text><text x="950" y="858" font-size="27" fill="#535e6b">القيم والجودة والأمانة والوعود.</text><rect x="90" y="920" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="962" font-size="24" fill="#81502c">04 / المتغيرات</text><text x="950" y="1018" font-size="35" font-weight="bold" fill="#28374a">كن مرنًا في بقية التفاصيل.</text><text x="950" y="1068" font-size="27" fill="#535e6b">راجع الشكل والسعر وقنوات البيع.</text><rect x="90" y="1130" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="1172" font-size="24" fill="#81502c">05 / الاختبار</text><text x="950" y="1228" font-size="35" font-weight="bold" fill="#28374a">جرّب نسخة مصغّرة ثم قرر.</text><text x="950" y="1278" font-size="27" fill="#535e6b">اختبار صغير ونتائج تساعدك على القرار.</text><text x="980" y="1410" fill="#ffd3a4" font-size="30">اجعل ذائقتك بداية، وعميلك حكمًا،</text><text x="980" y="1465" fill="white" font-size="29">وقيمك ثابتة.</text><text x="980" y="1540" fill="#ffd3a4" font-size="24">عبدالماجد العيلي · من الفكرة إلى الأثر</text></g></svg>