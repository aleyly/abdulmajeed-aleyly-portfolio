<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc"><title id="title">لماذا تستعين بمستشار قبل القرار الكبير؟</title><desc id="desc">خمس نقاط توضح قيمة التجربة في اكتشاف المشكلات واختصار التعلم ومراجعة القرارات، وكيف تختار مستشارًا عاش ما تواجهه.</desc><rect width="1080" height="1600" fill="#28374a"/><g direction="rtl" text-anchor="start" font-family="Tahoma,Arial,sans-serif"><text x="980" y="85" fill="#ffd3a4" font-size="25">مكتبة عبدالماجد العيلي · الاستشارات</text><text x="980" y="165" fill="white" font-size="55" font-weight="bold">لماذا تستعين بمستشار</text><text x="980" y="238" fill="#ffd3a4" font-size="55" font-weight="bold">قبل القرار الكبير؟</text><rect x="90" y="290" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="332" font-size="24" fill="#81502c">01 / التجربة</text><text x="950" y="388" font-size="35" font-weight="bold" fill="#28374a">الاستشارة خبرة، لا وقت فقط.</text><text x="950" y="438" font-size="28" fill="#535e6b">استفد من الخبرة المتراكمة.</text><rect x="90" y="500" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="542" font-size="24" fill="#81502c">02 / المشكلة</text><text x="950" y="598" font-size="35" font-weight="bold" fill="#28374a">راجع إشارات المشكلة مبكرًا.</text><text x="950" y="648" font-size="28" fill="#535e6b">ناقش الإشارات قبل وقوع المشكلة.</text><rect x="90" y="710" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="752" font-size="24" fill="#81502c">03 / اختصار التعلم</text><text x="950" y="808" font-size="35" font-weight="bold" fill="#28374a">اختصر التعلم من الأخطاء.</text><text x="950" y="858" font-size="28" fill="#535e6b">اسأل عن الأخطاء والدروس السابقة.</text><rect x="90" y="920" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="962" font-size="24" fill="#81502c">04 / القرار</text><text x="950" y="1018" font-size="35" font-weight="bold" fill="#28374a">وازن قيمة القرار وكلفة الخطأ.</text><text x="950" y="1068" font-size="28" fill="#535e6b">راجع قرارات الإيجار والشراكة والتسعير.</text><rect x="90" y="1130" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="1172" font-size="24" fill="#81502c">05 / اختيار المستشار</text><text x="950" y="1228" font-size="35" font-weight="bold" fill="#28374a">اختر مستشارًا عاش ما تواجهه.</text><text x="950" y="1278" font-size="28" fill="#535e6b">اسأل عن مشاريعه وتعثره وما تعلمه.</text><text x="980" y="1410" fill="#ffd3a4" font-size="32">استشر قبل القرار الكبير،</text><text x="980" y="1465" fill="white" font-size="32">لا بعد الخسارة.</text><text x="980" y="1540" fill="#ffd3a4" font-size="24">عبدالماجد العيلي · من الفكرة إلى الأثر</text></g></svg>