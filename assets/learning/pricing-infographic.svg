<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc"><title id="title">كيف تسعّر منتجك؟ وهل التكلفة وحدها تكفي؟</title><desc id="desc">خمس مراجعات للسعر: التكلفة الحقيقية، والبدائل، وقيمة المنتج في عين العميل، وهامش الاستمرار، وتجربة السعر ومراجعة النتائج.</desc><rect width="1080" height="1600" fill="#28374a"/><g direction="rtl" text-anchor="start" font-family="Tahoma,Arial,sans-serif"><text x="980" y="85" fill="#ffd3a4" font-size="25">مكتبة عبدالماجد العيلي · التسعير</text><text x="980" y="165" fill="white" font-size="54" font-weight="bold">كيف تسعّر منتجك؟</text><text x="980" y="238" fill="#ffd3a4" font-size="52" font-weight="bold">وهل التكلفة وحدها تكفي؟</text><rect x="90" y="290" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="332" font-size="24" fill="#81502c">01 / التكلفة</text><text x="950" y="388" font-size="35" font-weight="bold" fill="#28374a">احسب ما يكلفك فعلاً.</text><text x="950" y="438" font-size="27" fill="#535e6b">مواد + تشغيل + عمالة + إيجار + هدر.</text><rect x="90" y="500" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="542" font-size="24" fill="#81502c">02 / البدائل</text><text x="950" y="598" font-size="35" font-weight="bold" fill="#28374a">اعرف أسعار البدائل وما تقدمه.</text><text x="950" y="648" font-size="27" fill="#535e6b">قارن ما يقدمه البديل، لا السعر وحده.</text><rect x="90" y="710" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="752" font-size="24" fill="#81502c">03 / القيمة</text><text x="950" y="808" font-size="35" font-weight="bold" fill="#28374a">راجع القيمة في نظر العميل.</text><text x="950" y="858" font-size="27" fill="#535e6b">وضح ما يميز منتجك ويبرر سعره.</text><rect x="90" y="920" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="962" font-size="24" fill="#81502c">04 / الهامش</text><text x="950" y="1018" font-size="35" font-weight="bold" fill="#28374a">اترك هامشًا يدعم الاستمرار.</text><text x="950" y="1068" font-size="27" fill="#535e6b">هامش يدعم التشغيل والتطوير.</text><rect x="90" y="1130" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="1172" font-size="24" fill="#81502c">05 / الاختبار</text><text x="950" y="1228" font-size="35" font-weight="bold" fill="#28374a">جرّب السعر وراقب رد الفعل.</text><text x="950" y="1278" font-size="27" fill="#535e6b">جرّب، وراقب، ثم عدّل بناءً على النتائج.</text><text x="980" y="1410" fill="#ffd3a4" font-size="30">سعر يغطي تكلفتك ويناسب قيمتك،</text><text x="980" y="1465" fill="white" font-size="29">ويقبله عميلك.</text><text x="980" y="1540" fill="#ffd3a4" font-size="24">عبدالماجد العيلي · من الفكرة إلى الأثر</text></g></svg>