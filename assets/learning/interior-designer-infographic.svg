<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title"><title id="title">هل يحتاج مشروعك إلى مصمم داخلي؟</title><rect width="1080" height="1600" fill="#28374a"/><g direction="rtl" text-anchor="start" font-family="Tahoma,Arial,sans-serif"><text x="980" y="85" fill="#ffd3a4" font-size="24">مكتبة عبدالماجد العيلي · التصميم الداخلي</text><text x="980" y="165" fill="white" font-size="57" font-weight="bold">هل يحتاج مشروعك</text><text x="980" y="235" fill="#ffd3a4" font-size="57" font-weight="bold">إلى مصمم داخلي؟</text><rect x="90" y="290" width="900" height="185" rx="4" fill="#f5f3ee"/><text x="950" y="334" font-size="24" fill="#81502c">01 / التجربة</text><text x="950" y="388" font-size="37" font-weight="bold" fill="#28374a">هل تبيع تجربة، لا منتجًا فقط؟</text><text x="950" y="438" font-size="27" fill="#535e6b">المكان جزء من الخدمة والانطباع الأول.</text><rect x="90" y="500" width="900" height="185" rx="4" fill="#f5f3ee"/><text x="950" y="544" font-size="24" fill="#81502c">02 / المساحة</text><text x="950" y="598" font-size="37" font-weight="bold" fill="#28374a">هل مساحتك صغيرة أو معقدة؟</text><text x="950" y="648" font-size="27" fill="#535e6b">نظّم الحركة والخدمة والتخزين.</text><rect x="90" y="710" width="900" height="185" rx="4" fill="#f5f3ee"/><text x="950" y="754" font-size="24" fill="#81502c">03 / الهوية</text><text x="950" y="808" font-size="37" font-weight="bold" fill="#28374a">هل تريد هوية تميّزك؟</text><text x="950" y="858" font-size="27" fill="#535e6b">اربط الألوان والإضاءة والخامات بالهوية.</text><rect x="90" y="920" width="900" height="185" rx="4" fill="#f5f3ee"/><text x="950" y="964" font-size="24" fill="#81502c">04 / الميزانية</text><text x="950" y="1018" font-size="37" font-weight="bold" fill="#28374a">هل تخشى إعادة العمل؟</text><text x="950" y="1068" font-size="27" fill="#535e6b">اعتمد المخططات قبل الشراء والتنفيذ.</text><rect x="90" y="1130" width="900" height="185" rx="4" fill="#f5f3ee"/><text x="950" y="1174" font-size="24" fill="#81502c">05 / التنفيذ</text><text x="950" y="1228" font-size="37" font-weight="bold" fill="#28374a">هل تحتاج من يتابع التنفيذ؟</text><text x="950" y="1278" font-size="27" fill="#535e6b">وضّح مسؤوليات متابعة الأعمال.</text><text x="980" y="1410" fill="#ffd3a4" font-size="28">«نعم» على سؤالين أو أكثر؟ ناقش احتياجك مع مصمم.</text><text x="980" y="1470" fill="white" font-size="23">إرشاد من المقطع؛ نطاق العمل يحدد بعد مراجعة المشروع.</text><text x="980" y="1530" fill="#ffd3a4" font-size="24">عبدالماجد العيلي · تصميم وتنفيذ وتطوير أعمال</text></g></svg>