<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc"><title id="title">كيف تبني شخصية علامتك التجارية؟</title><desc id="desc">خمس خطوات تبدأ بالإحساس الذي تتركه علامتك، ثم تربط صفاتها بصوتها ومظهرها وتحافظ على اتساقها في كل نقطة تواصل.</desc><rect width="1080" height="1600" fill="#28374a"/><g direction="rtl" text-anchor="start" font-family="Tahoma,Arial,sans-serif"><text x="980" y="85" fill="#ffd3a4" font-size="25">مكتبة عبدالماجد العيلي · الهوية البصرية</text><text x="980" y="165" fill="white" font-size="54" font-weight="bold">شخصية علامتك</text><text x="980" y="238" fill="#ffd3a4" font-size="52" font-weight="bold">تظهر في كل تفصيلة.</text><rect x="90" y="290" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="332" font-size="24" fill="#81502c">01 / الإحساس</text><text x="950" y="388" font-size="35" font-weight="bold" fill="#28374a">حدد الإحساس الذي تتركه علامتك.</text><text x="950" y="438" font-size="27" fill="#535e6b">حدد الإحساس الذي يتذكره العميل.</text><rect x="90" y="500" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="542" font-size="24" fill="#81502c">02 / الصفات</text><text x="950" y="598" font-size="35" font-weight="bold" fill="#28374a">اختر ثلاث صفات تصف علامتك.</text><text x="950" y="648" font-size="27" fill="#535e6b">اختر ثلاث صفات، وما لا تمثله العلامة.</text><rect x="90" y="710" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="752" font-size="24" fill="#81502c">03 / الصوت</text><text x="950" y="808" font-size="35" font-weight="bold" fill="#28374a">حدد كيف تتكلم علامتك.</text><text x="950" y="858" font-size="27" fill="#535e6b">كلمات واضحة ونبرة ثابتة.</text><rect x="90" y="920" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="962" font-size="24" fill="#81502c">04 / المظهر</text><text x="950" y="1018" font-size="35" font-weight="bold" fill="#28374a">اجعل الشخصية مرئية.</text><text x="950" y="1068" font-size="27" fill="#535e6b">الألوان والشعار والمكان والتغليف بلغة واحدة.</text><rect x="90" y="1130" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="1172" font-size="24" fill="#81502c">05 / الاتساق</text><text x="950" y="1228" font-size="35" font-weight="bold" fill="#28374a">التزم بها في كل نقطة تواصل.</text><text x="950" y="1278" font-size="27" fill="#535e6b">الخدمة والرد والمحتوى والفريق بنبرة واحدة.</text><text x="980" y="1410" fill="#ffd3a4" font-size="30">علامة تعرف من هي، يعرفها عميلك.</text><text x="980" y="1465" fill="white" font-size="29">حدد شخصيتها، ثم التزم بها في كل تفاصيلها.</text><text x="980" y="1540" fill="#ffd3a4" font-size="24">عبدالماجد العيلي · من الفكرة إلى الأثر</text></g></svg>