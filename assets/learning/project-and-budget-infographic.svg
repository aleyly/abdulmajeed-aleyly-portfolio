<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc"><title id="title">ما المشروع المناسب لك؟ وكم ميزانيتك؟</title><desc id="desc">خمس خطوات تربط مهاراتك بحاجة السوق وقدرتك المالية، ثم تساعدك على حساب التأسيس والتشغيل واختبار الفكرة قبل التوسع.</desc><rect width="1080" height="1600" fill="#28374a"/><g direction="rtl" text-anchor="start" font-family="Tahoma,Arial,sans-serif"><text x="980" y="85" fill="#ffd3a4" font-size="25">مكتبة عبدالماجد العيلي · اختيار المشروع</text><text x="980" y="165" fill="white" font-size="55" font-weight="bold">ما المشروع المناسب لك؟</text><text x="980" y="238" fill="#ffd3a4" font-size="55" font-weight="bold">وكم ميزانيتك؟</text><rect x="90" y="290" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="332" font-size="24" fill="#81502c">01 / مهاراتك</text><text x="950" y="388" font-size="35" font-weight="bold" fill="#28374a">ابدأ من نفسك، لا من الموضة.</text><text x="950" y="438" font-size="28" fill="#535e6b">راجع مهاراتك وما تتقنه أو تحبه.</text><rect x="90" y="500" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="542" font-size="24" fill="#81502c">02 / السوق</text><text x="950" y="598" font-size="35" font-weight="bold" fill="#28374a">ابحث عن حاجة يدفع الناس مقابلها.</text><text x="950" y="648" font-size="28" fill="#535e6b">اسأل عملاء محتملين عن الحاجة والسعر.</text><rect x="90" y="710" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="752" font-size="24" fill="#81502c">03 / قدرتك المالية</text><text x="950" y="808" font-size="35" font-weight="bold" fill="#28374a">حدد ما يمكنك تحمّله.</text><text x="950" y="858" font-size="28" fill="#535e6b">حدد سقفًا ماليًا تستطيع تحمّله.</text><rect x="90" y="920" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="962" font-size="24" fill="#81502c">04 / الميزانية</text><text x="950" y="1018" font-size="35" font-weight="bold" fill="#28374a">احسب التأسيس والتشغيل والاحتياط.</text><text x="950" y="1068" font-size="28" fill="#535e6b">تأسيس + تشغيل شهري + احتياط.</text><rect x="90" y="1130" width="900" height="185" rx="12" fill="#f5f3ee"/><text x="950" y="1172" font-size="24" fill="#81502c">05 / التجربة</text><text x="950" y="1228" font-size="35" font-weight="bold" fill="#28374a">ابدأ بنسخة مصغّرة ثم وسّع.</text><text x="950" y="1278" font-size="28" fill="#535e6b">اختبار صغير قبل الالتزام الكبير.</text><text x="980" y="1410" fill="#ffd3a4" font-size="32">المشروع المناسب: تتقنه، ويطلبه السوق،</text><text x="980" y="1465" fill="white" font-size="32">وتتحمله ميزانيتك.</text><text x="980" y="1540" fill="#ffd3a4" font-size="24">عبدالماجد العيلي · من الفكرة إلى الأثر</text></g></svg>